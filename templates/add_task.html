{% extends "index.html" %}

{% block title %}Add Task{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">Add New Task</h2>
                <form method="POST" action="{{ url_for('add_task') }}">
                    <div class="mb-3">
                        <label for="assignee" class="form-label">Assignee</label>
                        <select class="form-select" id="assignee" name="assignee" required>
                            <option value="">Select a user</option>
                            {% for user in users %}
                                <option value="{{ user }}">{{ user }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="title" class="form-label">Title</label>
                        <input type="text" class="form-control" id="title" name="title" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="due_date" class="form-label">Due Date (YYYY-MM-DD)</label>
                        <input type="date" class="form-control" id="due_date" name="due_date" value="2024-10-10" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Add Task</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
